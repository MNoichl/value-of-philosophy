# Copy to config.toml (git-ignored) and adjust for the machine.

[paths]
# Root of the persistent volume holding everything data-related.
data_root = "/data/openalex_project_storage/vop"
# OpenAlex parquet snapshot root (contains works/, sources/, ... with updated_date=* partitions)
snapshot_root = "/data/openalex_project_storage/vop/raw/openalex/data/parquet"
# Small subset for development; same layout as snapshot_root
dev_snapshot_root = "/data/openalex_project_storage/vop/dev_sample/data/parquet"

[duckdb]
threads = 7
memory_limit = "24GB"
temp_directory = "/data/openalex_project_storage/vop/tmp"

[params]
# philosophers: minimum works and minimum share in philosophy sources
min_works = 5
# articles before this year are ignored when computing author shares
author_year_min = 1950
min_share = 0.5
# focal works year window
year_min = 1970
year_max = 2022
# OpenAlex primary-topic subfields dropped from the focal set (philosophy published under another ISSN)
excluded_subfields = ["Philosophy", "History and Philosophy of Science"]
# matching
max_year_diff = 3
max_author_diff = 3
controls_per_focal = 4
seed = 42
citation_window_years = 5
